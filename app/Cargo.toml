[workspace]
resolver = "3"
members = ["crates/umbra-core", "crates/umbra-cli", "crates/umbra-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the FFmpeg libraries Umbra uses, so fewer DLLs ship with the app.
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

# The capture and encode path is timing sensitive, so keep dependencies optimised in dev builds.
[profile.dev.package."*"]
opt-level = 2
