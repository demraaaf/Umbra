[package]
name = "umbra"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
description = "Umbra: an open-source, offline game clipper for Windows"
default-run = "umbra"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
umbra-core = { path = "../umbra-core" }
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "protocol-asset", "compression"] }
rfd = { version = "0.17", default-features = false }
tauri-plugin-notification = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse"] }
